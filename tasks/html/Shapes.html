<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .left {
            height: 200px;
            width: 200px;
            background-color: rgb(255, 0, 17);
            clip-path: polygon(40% 0%,
                    40% 20%,
                    100% 20%,
                    100% 80%,
                    40% 80%,
                    40% 100%,
                    0% 50%);
        }

        .right {
            height: 200px;
            width: 200px;
            background-color: rgb(0, 157, 255);
            clip-path: polygon(0% 20%,
                    60% 20%,
                    60% 0%,
                    100% 50%,
                    60% 100%,
                    60% 80%,
                    0% 80%);
        }

        .star {
            height: 200px;
            width: 200px;
            background-color: rgb(234, 255, 0);
            clip-path: polygon(50% 0%, 63% 38%, 100% 38%, 69% 59%, 82% 100%, 50% 75%, 18% 100%, 31% 59%, 0% 38%, 37% 38%);
        }
        
        .up {
            height: 200px;
            width: 200px;
            background-color:lawngreen;
            clip-path: polygon(50% 0%, 100% 40%, 80% 40%, 80% 100%,20% 100%, 20% 40%,0% 40%);
        }

        .down {
            height: 200px;
            width: 200px;
            background-color: blueviolet ;
            clip-path: polygon(20% 0%, 80% 0%,80% 60%,100% 60%,50% 100%,0% 60%, 20% 60%,20% 0%);
        }

        .pents {
            height: 200px;
            width: 200px;
            background-color: blue; 
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
        }
        .Rhombus {
            height: 200px;
            width: 200px;
            background-color: rebeccapurple; 
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }
        
        .sstr {
            height: 200px;
            width: 200px;
            background-color: firebrick; 
            clip-path: polygon(50% 0%, 60% 25%, 100% 25%, 80% 50% , 100% 75% , 60% 75% , 50% 100% ,40% 75% ,0% 75% ,25% 50%,0% 25% ,40% 25% );
        }
    </style>
</head>

<body >
    <div class="left"></div> <br>
    <div class="right"></div> <br>
    <div class="star"></div> <br>
    <div class="up"></div> <br>
    <div class="down"></div> <br>
    <div class="pent"></div> <br>
    <div class="Rhombus"></div> <br>
    <div class="sstr"></div>


</body>

</html>
