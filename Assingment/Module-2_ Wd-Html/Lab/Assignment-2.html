<!-- Lab Assignment -->
<!--  Create a product catalog table that includes the following columns: 
o Product Name 
o Product Image (use placeholder image URLs) 
o Price 
o Description 
o Availability (in stock, out of stock) -->

<!-- Additional Requirements: 

o Use thead for the table header.  
o Use colspan or rowspan to merge cells where applicable. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOCK LIST</title>
    <style>
        .in {
            color: green;
        }
        .out{
            color: red;
        }

    </style>
</head>

<body>
    <table  cellpadding="10px" border="2px" align="center">
        <caption> STOCK LIST </caption>
         <thead>

            <th>Product name</th>

            <th>Price</th>
            <th>Description</th>
            <th>Availability</th>
        </tr>
    </thead>
        <tr>

        </tr>
        <tr>

            <td><img src="./Assets/POD.jfif" width="200px" height="200px" alt=""></td>

        </tr>
        <tr>

</body>
</html>
