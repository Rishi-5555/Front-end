<!-- Lab Assignment -->
<!--  Create a product catalog table that includes the following columns: 
o Product Name 
o Product Image (use placeholder image URLs) 
o Price 
o Description 
o Availability (in stock, out of stock) -->

<!-- Additional Requirements: 

o Use thead for the table header.  
o Use colspan or rowspan to merge cells where applicable. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOCK LIST</title>
    <style>
        .in {
            color: green;
        }
        .out{
            color: red;
        }

    </style>
</head>

<body>
    <table  cellpadding="10px" border="2px" align="center">
        <caption> STOCK LIST </caption>
         <thead>
         <tr>
            <th>Product name</th>
            <th>Product image</th>
            <th>Price</th>
            <th>Description</th>
            <th>Availability</th>
        </tr>
    </thead>
        <tr>
            <td>Squat Rack</td>
            <td><img src="https://garagegymlab.com/wp-content/uploads/Rogue-RML-3WC-Folding-Squat-Rack.jpg" width="200px" height="200px" alt=""></td>
            <td>180$</td>
            <td>GREAT </td>
            <td class="in">INSTOCK</td>
        </tr>
        <tr>
            <td>Pair Of Dumbbells</td>
            <td><img src="https://i5.walmartimages.com/asr/2c199c0c-d7c0-4430-b4ae-a72344ab4f52_3.f6efa957923ff1f323977ee79f6b9c23.jpeg" width="200px" height="200px" alt=""></td>
            <td>68.96$</td>
            <td>GREAT Quality</td>
            <td class="in">INSTOCK</td>
        </tr>
        <tr>
            <td>Sport Shoes</td>
            <td><img src="https://images-na.ssl-images-amazon.com/images/I/71PmnGC2ItL._AC_UL1000_.jpg" width="200px" height="200px" alt=""></td>
            <td>40$</td>
            <td>GREAT </td>
            <td class="out">OUT OF STOCK</td>
        </tr>
        <tr>
            <td>Barbells</td>
            <td><img src="https://yorkbarbell.com/wp-content/uploads/2017/01/2900_300LBStandardOlympicSet.jpg" width="200px" height="200px" alt=""></td>
            <td>100$</td>
            <td>GREAT </td>
            <td class="in">INSTOCK</td>
        </tr>
        <tr>
            <td>5kg Protein </td>
            <td><img src="https://vuagym.com/wp-content/uploads/2020/09/album.jpg" width="200px" height="200px" alt=""></td>
            <td>56$</td>
            <td>GREAT </td>
            <td class="out">OUT OF STOCK</td>
        </tr>
    </table>
</body>
</html>
