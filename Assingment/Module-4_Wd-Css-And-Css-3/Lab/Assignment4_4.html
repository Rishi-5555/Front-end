<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Grid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f5f5f5;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 columns */
      gap: 20px; /* space between grid items */
    }

    .product-card {
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }

    .product-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .product-info {
      padding: 15px;
    }

    .product-title {
      font-size: 1.1em;
      margin-bottom: 10px;
      color: #333;
    }

    .product-price {
      font-size: 1em;
      color: #4CAF50;
      font-weight: bold;
    }

    /* Responsive layout */
    @media (max-width: 900px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <h1>Our Products</h1>
  
  <div class="grid-container">
    <!-- Product Card 1 -->
    <div class="product-card">
      <img class="product-image" src="https://via.placeholder.com/300x200" alt="Product 1">
      <div class="product-info">
        <div class="product-title">Product One</div>
        <div class="product-price">$19.99</div>
      </div>
    </div>

    <!-- Product Card 2 -->
    <div class="product-card">
      <img class="product-image" src="https://via.placeholder.com/300x200" alt="Product 2">
      <div class="product-info">
        <div class="product-title">Product Two</div>
        <div class="product-price">$24.99</div>
      </div>
    </div>

    <!-- Product Card 3 -->
    <div class="product-card">
      <img class="product-image" src="https://via.placeholder.com/300x200" alt="Product 3">
      <div class="product-info">
        <div class="product-title">Product Three</div>
        <div class="product-price">$14.99</div>
      </div>
    </div>

    <!-- Product Card 4 -->
    <div class="product-card">
      <img class="product-image" src="https://via.placeholder.com/300x200" alt="Product 4">
      <div class="product-info">
        <div class="product-title">Product Four</div>
        <div class="product-price">$34.99</div>
      </div>
    </div>

    <!-- Product Card 5 -->
    <div class="product-card">
      <img class="product-image" src="https://via.placeholder.com/300x200" alt="Product 5">
      <div class="product-info">
        <div class="product-title">Product Five</div>
        <div class="product-price">$29.99</div>
      </div>
    </div>

    <!-- Product Card 6 -->
    <div class="product-card">
      <img class="product-image" src="https://via.placeholder.com/300x200" alt="Product 6">
      <div class="product-info">
        <div class="product-title">Product Six</div>
        <div class="product-price">$22.99</div>
      </div>
    </div>

    <!-- Product Card 7 -->
    <div class="product-card">
      <img class="product-image" src="https://via.placeholder.com/300x200" alt="Product 7">
      <div class="product-info">
        <div class="product-title">Product Seven</div>

        <div class="product-title">Product Eight</div>
        <div class="product-price">$21.99</div>
      </div>
    </div>

    <!-- Product Card 9 -->
    <div class="product-card">
      <img class="product-image" src="https://via.placeholder.com/300x200" alt="Product 9">
      <div class="product-info">
        <div class="product-title">Product Nine</div>
        <div class="product-price">$18.99</div>
      </div>
    </div>
  </div>

</body>
</html>
